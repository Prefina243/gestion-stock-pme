name: gestion_stock_pme
description: "Application de gestion de stock pour PME – Flutter + Firebase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  # -----  Firebase -----
  firebase_core: ^3.2.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # -----  Packages utilitaires -----
  provider: ^6.1.2
  mobile_scanner: ^3.5.0
  http: ^1.2.2
  intl: ^0.20.2
  fl_chart: ^1.1.1
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/